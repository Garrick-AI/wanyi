<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>萬一手冊</title>
<meta name="description" content="萬一手冊：以一問一答方式整理銀行戶口、保單、強積金、重要文件位置及身後事意願，自動生成 PDF 手冊留給家人。資料只保存在你的裝置，第一部分免費試用。">
<link rel="canonical" href="https://garrick-ai.github.io/wanyi/">
<link rel="alternate" hreflang="zh-Hant-HK" href="https://garrick-ai.github.io/wanyi/">
<link rel="alternate" hreflang="en" href="https://garrick-ai.github.io/wanyi/en/">
<link rel="alternate" hreflang="x-default" href="https://garrick-ai.github.io/wanyi/">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="萬一手冊">
<meta name="theme-color" content="#FBF5EC">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<script src="i18n.js"></script>
<script defer src="lib/pdf-lib.min.js"></script>
<script defer src="pdfbook.js"></script>
<style>
  :root{
    --paper:#FBF5EC; --card:#FFFDF9; --ink:#3E342C; --muted:#9A8C7E; --line:#EADFD2;
    --accent:#C26A4A; --accent-dark:#A0553A; --accent-soft:#F6E3D3; --sage:#8BA88E; --sage-soft:#E4ECE3; --warn:#A0553A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{position:relative;max-width:560px;margin:0 auto;padding:28px 20px 48px;min-height:100vh;display:flex;flex-direction:column}
  .lang{position:absolute;top:20px;right:20px;border:1px solid var(--line);background:var(--card);color:var(--accent-dark);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .seg button{flex:1;min-width:90px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 10px;font:inherit;font-size:14px;cursor:pointer}
  .seg button.on{border-color:var(--accent);background:#FCEEE4;color:var(--accent-dark);font-weight:500}
  h1,h2,h3{font-family:"Noto Serif TC",serif;font-weight:700;margin:0}
  .brand{font-family:"Noto Serif TC",serif;font-size:14px;letter-spacing:.2em;color:var(--accent);margin-bottom:12px}
  .art{margin:0 auto 14px;max-width:260px}
  .hero h1{font-size:34px;line-height:1.3;margin-bottom:14px}
  .lead{font-size:16px;line-height:1.8;color:#5b5046}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 18px;box-shadow:0 2px 10px rgba(160,85,58,.05)}
  .promise{display:flex;gap:12px;align-items:flex-start;margin:22px 0}
  .promise svg{flex:none;margin-top:2px}
  .promise p{margin:0;font-size:14px;line-height:1.7;color:#5b5046}
  .parts{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
  .parts li{display:flex;gap:10px;align-items:center;font-size:14.5px}
  .num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
  .spacer{flex:1}
  .btn{appearance:none;border:0;border-radius:999px;padding:15px 18px;font:inherit;font-size:16px;font-weight:500;
    cursor:pointer;width:100%;transition:transform .08s ease, background .2s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(194,106,74,.25)}
  .btn:disabled{opacity:.6}
  .btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .btn-text{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:10px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .btn-row{display:flex;gap:10px;margin-top:24px}
  .btn-row .btn{flex:1}
  .stack{display:grid;gap:10px;margin-top:24px}
  .resume{background:var(--accent-soft);border-radius:16px;padding:14px 16px;font-size:14px;margin-top:18px;line-height:1.6}

  .top{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease}
  .top small{color:var(--muted);font-size:12px;white-space:nowrap}
  .sec-tag{font-size:13px;color:var(--accent);letter-spacing:.08em;margin-bottom:10px}
  .q{font-size:24px;line-height:1.45;margin-bottom:10px}
  .hint{font-size:14px;color:var(--muted);line-height:1.7;margin:0 0 20px}

  input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:14px 16px;outline:none;transition:border-color .2s}
  input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:180px;resize:vertical;line-height:1.7}
  label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  .choices{display:grid;gap:10px}
  .choice{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer;width:100%}
  .choice .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
  .choice.multi .dot{border-radius:6px}
  .choice.on{border-color:var(--accent);background:#FCEEE4}
  .choice.on .dot{border-color:var(--accent);background:var(--accent)}
  .choice.on .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
  .choice.multi.on .dot::after{width:10px;height:6px;border-radius:0;background:none;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
  .row{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px 14px;margin-bottom:10px}
  .row .del{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:6px}
  .row-title{font-size:12px;color:var(--accent);margin-top:8px}
  .savebtn{border:1px solid var(--line);background:var(--card);color:var(--accent-dark);border-radius:999px;padding:6px 14px;font:inherit;font-size:13.5px;cursor:pointer;flex:none}
  .sheet-bg{position:fixed;inset:0;background:rgba(62,52,44,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .sheet{background:var(--paper);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
  @media (min-width:700px){ .sheet-bg{align-items:center} .sheet{border-radius:24px} }
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{border:1px solid var(--line);background:#FCF3EA;color:var(--accent-dark);border-radius:999px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer}
  .chip:active{background:var(--accent-soft)}
  .mic{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:10px 2px 0}
  .add{width:100%;border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:12px;font:inherit;font-size:15px;cursor:pointer}

  .intro{flex:1;display:flex;flex-direction:column;justify-content:center}
  .intro .big{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center;font-size:26px;font-family:"Noto Serif TC",serif}
  .intro h2{font-size:30px;margin:8px 0 12px}

  .sum{display:grid;gap:10px;margin-top:20px}
  .sum .card{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .sum .t{flex:1;font-size:15px}
  .sum .c{font-size:13px;color:var(--muted)}
  .sum button{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:4px 6px}
  .note{font-size:13px;color:var(--muted);line-height:1.7;margin-top:12px;text-align:center}
  .note.err{color:var(--warn)}
  .confirm{background:#fff4ee;border:1px solid #efcfc5;border-radius:16px;padding:14px;margin-top:14px;font-size:14px;line-height:1.6}
  .confirm .btn-row{margin-top:12px}

  /* Handbook preview (mirrors the PDF) */
  .book-wrap{max-width:820px}
  .book-bar{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;gap:10px;padding:12px 0 14px;align-items:center}
  .book-bar .btn{width:auto;padding:11px 18px;font-size:15px}
  .bk-page{position:relative;overflow:hidden;background:#FBF5EC;color:#3E342C;border-radius:14px;
    box-shadow:0 1px 3px rgba(80,50,30,.06),0 10px 30px rgba(160,85,58,.08);padding:44px 26px 36px;margin-bottom:18px;font-size:14px;line-height:1.75}
  .bk-page.decor::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#F6E3D3;opacity:.55;top:-130px;right:-90px}
  .bk-page.decor::after{content:"";position:absolute;width:52px;height:52px;border-radius:50%;background:#E4ECE3;top:20px;right:90px}
  .bk-page > *{position:relative;z-index:1}
  .bk-sec{display:flex;align-items:center;gap:12px}
  .bk-sec .n{width:36px;height:36px;border-radius:50%;background:#F6E3D3;color:#A0553A;display:grid;place-items:center;font-family:"Noto Serif TC",serif;font-size:17px;font-weight:700}
  .bk-sec h2{font-size:24px;color:#3E342C}
  .bk-why{font-size:13px;color:#9A8C7E;margin:10px 0 6px}
  .bk-rule{width:36px;height:2px;background:#C26A4A;margin:6px 0 18px}
  .bk-h3{display:flex;align-items:center;gap:8px;font-family:"Noto Serif TC",serif;font-weight:700;font-size:15px;margin:20px 0 8px}
  .bk-h3::before{content:"";width:7px;height:7px;border-radius:50%;background:#8BA88E}
  .kv{display:grid;grid-template-columns:96px 1fr}
  .kv div{padding:9px 4px;border-bottom:1px solid #EADFD2;white-space:pre-wrap}
  .kv div:nth-child(odd){color:#9A8C7E;font-size:13px}
  table.bt{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
  table.bt th{white-space:pre-line;text-align:left;font-weight:500;color:#A0553A;font-size:12px;background:#F6E3D3;padding:6px 8px}
  table.bt th:first-child{border-radius:9px 0 0 9px} table.bt th:last-child{border-radius:0 9px 9px 0}
  table.bt td{border-bottom:1px solid #EADFD2;padding:8px 8px;vertical-align:top}
  table.bt tr:nth-child(odd) td{background:rgba(255,253,249,.8)}
  .empty{color:#C9BCAD}
  .letter{white-space:pre-wrap;font-size:15px;line-height:28px;background:#FFFDF9 repeating-linear-gradient(transparent 0 27px,#EADFD2 27px 28px);
    background-origin:content-box;border:1px solid #F6E3D3;border-radius:16px;padding:18px 22px;min-height:200px}
  .cover{position:relative;text-align:center;padding:30px 10px 10px;min-height:560px;display:flex;flex-direction:column;align-items:center}
  .bk-page.cv::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;background:#F6E3D3;opacity:.7;left:50%;bottom:-360px;transform:translateX(-50%)}
  .bk-page.cv::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#FAEEE3;left:50%;bottom:-300px;transform:translateX(-50%)}
  .cover .kick{font-size:11px;letter-spacing:.2em;color:#9A8C7E;margin-top:14px}
  .cover .t{font-family:"Noto Serif TC",serif;font-weight:700;font-size:44px;color:#C26A4A;letter-spacing:.12em;margin-top:6px}
  .cover .sub{font-size:14px;color:#9A8C7E}
  .cover .owner{font-size:20px;margin-top:28px;padding:0 24px 6px;border-bottom:1px solid #C9BCAD;min-width:140px;min-height:36px}
  .cover .d{font-size:12px;color:#9A8C7E;margin-top:8px}
  .cover .msg{margin-top:auto;background:#FFFDF9;border:1px solid #F6E3D3;border-radius:18px;padding:18px 26px;font-size:14px;line-height:1.9}
  .bk-step{margin:0 0 16px}
  .bk-step-h{display:flex;align-items:center;gap:10px;font-family:"Noto Serif TC",serif;font-weight:700;font-size:15.5px}
  .bk-step-h .n{width:26px;height:26px;border-radius:50%;background:#F6E3D3;color:#A0553A;display:grid;place-items:center;font-size:13px}
  .bk-step ul{margin:6px 0 0;padding-left:52px;font-size:13.5px}
  .bk-step li{margin:4px 0;white-space:pre-line}
  .bk-page p{white-space:pre-line}
  .bk-sub{font-size:13px;color:#9A8C7E;margin:2px 0 0 48px}
  .bk-step li::marker{color:#8BA88E}
  .disc{font-size:12px;color:#9A8C7E;line-height:1.8;border-top:1px solid #EADFD2;padding-top:14px;margin-top:24px}
  @media (min-width:700px){ .bk-page{padding:56px 56px} }
</style>

</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
const SECS = [
  {t:"我是誰", d:"基本資料與聯絡人。發生意外時，家人第一時間最需要的就是這些。"},
  {t:"醫療", d:"緊急時醫護人員和家人需要知道的健康資料與醫療意願。"},
  {t:"資產", d:"只寫「在哪裡找得到」，不用寫戶口號碼和密碼。就算手冊遺失，也不會有風險。"},
  {t:"保險與退休", d:"保單和強積金往往是家人最容易遺漏的部分。"},
  {t:"負債與定期支出", d:"讓家人知道哪些款項要繼續付、哪些服務要取消。"},
  {t:"數碼生活", d:"手機、電郵、社交媒體，現在很多重要的東西都在裡面。"},
  {t:"生意", d:"如果你有經營公司或持有公司股份，請在這裡記下。沒有的話可以直接略過。"},
  {t:"照顧家人", d:"如果你暫時無法照顧他們，誰可以接手、要注意甚麼。"},
  {t:"身後事意願", d:"預先表達你的意願，家人就不用在傷痛中猜測。"},
  {t:"心意", d:"最後一部分，留下你想說的話。"}
];
const YN = ["有","沒有"];
const APPLY = [["有子女","kids"],["有長輩要照顧","elders"],["有寵物","pets"],["有物業","prop_yn"],["有股票或基金投資","invest_yn"],["有加密貨幣","crypto_yn"],["有個人保險","ins_yn"],["有按揭以外的貸款","loans_yn"],["有經營公司或持有公司股份","biz_yn"]];
const NONE_OPT = "以上都沒有";
const has = (a,label) => (a.applies||[]).includes(label);
const careShow = label => a => !a.applies_set || has(a,label);
const REL = ["太太","丈夫","兒子","女兒","父親","母親","兄弟","姊妹"];
const BANK_CHIPS = {"香港":["滙豐","中銀香港","恒生","渣打","東亞","花旗","星展","ZA Bank"],"中國內地":["中國銀行","工商銀行","建設銀行","招商銀行","農業銀行"],"台灣":["國泰世華","中國信託","台新","玉山","台灣銀行"],"英國":["HSBC UK","Barclays","Lloyds","NatWest","Monzo"]};
const Q = [
  {sec:0,id:"name",core:true,type:"text",q:"你的全名是？",hint:"會印在手冊封面上。",ph:"例如：陳大文"},
  {sec:0,id:"nick",type:"text",q:"家人平常怎樣稱呼你？",hint:"選填。",ph:"例如：阿文、爸爸"},
  {sec:0,id:"marital",type:"choice",q:"你的婚姻狀況是？",opts:["未婚","已婚","同居","離婚","喪偶"]},
  {sec:0,id:"applies",type:"multi",core:true,q:"以下哪些情況適用於你？",hint:"可以選多項。沒有選的項目，之後不會再問，可以省下不少時間。",opts:APPLY.map(x=>x[0]).concat([NONE_OPT])},
  {sec:0,id:"family",core:true,type:"list",q:"你的家庭成員有哪些？",hint:"包括配偶、子女、父母、兄弟姊妹。",
    fields:[{k:"name",l:"姓名"},{k:"rel",l:"關係",ph:"例如：太太、大女",chips:REL},{k:"phone",l:"電話"}],item:"家人"},
  {sec:0,id:"ec_local",core:true,type:"group",q:"發生意外時，第一個要聯絡的人是誰？",hint:"最好是住在附近、隨時聯絡得到的人。",
    fields:[{k:"name",l:"姓名"},{k:"rel",l:"關係",chips:REL},{k:"phone",l:"電話"}]},
  {sec:0,id:"ec_far_yn",type:"choice",q:"有沒有一位住在其他城市或國家的聯絡人？",hint:"遇到嚴重意外或天災時，外地聯絡人往往更容易聯絡上。",opts:YN},
  {sec:0,id:"ec_far",type:"group",q:"外地聯絡人是誰？",showIf:a=>a.ec_far_yn==="有",
    fields:[{k:"name",l:"姓名"},{k:"rel",l:"關係",chips:REL},{k:"phone",l:"電話"},{k:"city",l:"所在城市"}]},
  {sec:0,id:"docs",core:true,type:"multi",q:"以下哪些重要文件你有？",hint:"可以選多項。下一步會問它們放在哪裡。",
    opts:["香港身份證","護照","出世紙","結婚證書","樓契／物業文件","遺囑正本","保單正本","持久授權書","預設醫療指示"]},
  {sec:0,id:"docs_loc",core:true,type:"per",src:"docs",q:"這些文件放在哪裡？",hint:"寫得越具體越好，例如哪個房間、哪個櫃、甚麼顏色的盒子。",
    ph:"例如：睡房衣櫃頂層藍色文件盒",showIf:a=>(a.docs||[]).length>0},

  {sec:1,id:"doctor",type:"group",q:"你平常看哪位醫生？",hint:"家庭醫生或長期覆診的專科醫生。",
    fields:[{k:"name",l:"醫生／診所"},{k:"phone",l:"電話"},{k:"hosp",l:"常去的醫院",ph:"例如：瑪麗醫院"}]},
  {sec:1,id:"med",voice:true,type:"textarea",q:"有沒有醫護人員需要知道的健康資料？",hint:"例如長期病患、正在服用的藥物、藥物敏感。選填。",ph:"例如：對盤尼西林敏感"},
  {sec:1,id:"amd",core:true,type:"choice",q:"你有沒有簽署預設醫療指示？",hint:"《維持生命治療的預作決定條例》已於2026年7月31日生效，年滿18歲人士可預先表明在指定情況下拒絕某些維持生命治療。",
    opts:["已經簽署","未簽署，但想了解","未有考慮"]},
  {sec:1,id:"amd_d",type:"text",q:"文件存放在哪裡？在哪間醫院或由哪位醫生見證？",showIf:a=>a.amd==="已經簽署",ph:"例如：正本在書房抽屜，由家庭醫生見證"},
  {sec:1,id:"organ",type:"choice",q:"你對器官捐贈的意願是？",hint:"可在衞生署「中央器官捐贈登記名冊」登記。即使已登記，醫院仍會徵詢家屬同意，所以記得讓家人知道。",
    opts:["已在中央名冊登記","願意，但未登記","不願意","未決定"]},

  {sec:2,id:"bank_regions",core:true,type:"multi",q:"你在哪些地方有銀行戶口？",hint:"跨地區的資產最容易被遺漏。",

const ATT_NAME="wanyi-data.json";
const b64=u=>{ let s=""; const a=new Uint8Array(u); for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); };
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function pwKey(pw,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function makePayload(pw){
  const data={A,saved:new Date().toISOString()};
  if(!pw) return new TextEncoder().encode(JSON.stringify({app:"wanyi",v:1,enc:false,data}));
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await pwKey(pw,salt),new TextEncoder().encode(JSON.stringify(data)));
  return new TextEncoder().encode(JSON.stringify({app:"wanyi",v:1,enc:true,salt:b64(salt),iv:b64(iv),ct:b64(ct)}));
}
async function openPayload(p,pw){
  if(!p.enc) return p.data;
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(p.iv)},await pwKey(pw,unb64(p.salt)),unb64(p.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

}
function pdfReadyHTML(){
  if(!state.pdfReady) return "";
  return `<div class="card" style="margin-top:14px;border-color:var(--accent)">
    <div style="font-weight:700;margin-bottom:6px">${L("PDF 已經準備好","Your PDF is ready")}</div>
    <p class="hint" style="margin:0 0 12px">${L("按下面的按鈕，再選擇「儲存到檔案」（iPhone）或「儲存」（Android），就可以把手冊存到手機。","Tap the button below, then choose \"Save to Files\" (iPhone) or \"Save\" (Android) to keep the handbook on your phone.")}</p>
    <button class="btn btn-primary" data-act="sharepdf">${L("儲存 PDF 到手機","Save PDF to phone")}</button>
    <a class="btn-text" style="display:block;text-align:center;margin-top:6px" href="${state.pdfUrl}" target="_blank" rel="noopener">${L("在新分頁開啟 PDF","Open PDF in a new tab")}</a>
  </div>`;
}
async function makePdf(){
  if(state.busy) return;
  if(!DL && IN_CLAUDE){ state.msg=L("目前的瀏覽環境暫不支援下載檔案，你仍然可以點選「查看我的手冊」在螢幕上瀏覽。","Downloads aren't supported here. You can still tap \"View my handbook\" to see it on screen."); state.msgErr=true; render(); return; }
  if(!window.PDFLib || !window.WanyiPdf){ state.msg=L("PDF 工具未載入完成，請稍後再試。","The PDF tools are still loading. Please try again in a moment."); state.msgErr=true; render(); return; }
  state.pdfReady=false; state.busy=true; state.msg=L("第一次會先下載中文字型，大約需要十幾秒。PDF 檔案約 6MB。","The first time, fonts need to download, which takes ten seconds or so. The PDF is about 6 MB."); state.msgErr=false; render();
  try{
    const f=await fonts();
    const nm=(A.name&&A.name.trim())?A.name.trim():"";
    const payload=await makePayload(String(state.pw||""));
    const lg=pdfLang();
    const bytes=await window.WanyiPdf.buildPdf(window.PDFLib,f,blocksFor(lg),{owner:nm,lang:lg,attach:{name:ATT_NAME,bytes:payload}});
    const fname=`${lg==="en"?"Just-in-Case-Handbook":"萬一手冊"}${nm?"-"+nm:""}.pdf`, blob=new Blob([bytes],{type:"application/pdf"});
    if(DL){ await DL.save({filename:fname, data:blob}); state.msg=L("已交由你的裝置儲存。請記得存放在安全的地方。","Handed to your device to save. Keep it somewhere safe."); state.msgErr=false; }
    else {
      const file=new File([blob],fname,{type:"application/pdf"});
      if(state.pdfUrl) URL.revokeObjectURL(state.pdfUrl);
      state.pdfFile=file; state.pdfUrl=URL.createObjectURL(blob);
      const canShare = IS_MOBILE && navigator.canShare && navigator.canShare({files:[file]});
      if(canShare){ state.pdfReady=true; state.msg=""; }
      else { const a=document.createElement("a"); a.href=state.pdfUrl; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
        state.msg=L("PDF 已開始下載。請記得存放在安全的地方。","Your PDF is downloading. Keep it somewhere safe."); state.msgErr=false; }
    }
  }catch(err){
    const code=err&&err.code;
    state.msg = code==="declined" ? L("你已取消下載。","Download cancelled.") : code==="rate_limited" ? L("請稍候再試一次。","Please wait a moment and try again.") :
      (err&&(err.message==="font"||err.message==="script")) ? L("字型下載失敗，請檢查網路連線後再試。","Fonts failed to download. Please check your connection and try again.") : L("下載未能完成，請稍後再試。","The download didn't finish. Please try again later.");
    state.msgErr = code!=="declined";
  }finally{ state.busy=false; render(); }
}
(async()=>{ try{ if(window.claude && typeof window.claude.use==="function"){ DL=await window.claude.use("downloads"); } }catch(_){ DL=null; } })();

if(location.hash==="#faq"){ state.prevStep="welcome"; state.step="faq"; }
render();
window.addEventListener("load",()=>{ if(state.step==="book") render(); });
})();
</script>
